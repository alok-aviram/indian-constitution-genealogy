<text x="20" y="498.0" font-size="12" font-weight="bold" fill="#8a8a8a">none — CrPC 1898</text>
<text x="20" y="512.0" font-size="8.6" fill="#777">Article 22’s rules lived in the Code of Criminal Procedure</text>
<text x="20" y="523.0" font-size="8.6" fill="#777">1898, a statute, until Ambedkar’s article 15-A of Sept 1949</text>
<rect x="312" y="494.0" width="52" height="24" rx="12" fill="#ffffff" stroke="#8a8a8a" stroke-width="1.2" stroke-dasharray="3,2"/>
<text x="338.0" y="509.5" font-size="9.5" font-weight="bold" fill="#8a8a8a" text-anchor="middle">Art. 22</text>
<text x="380" y="510.5" font-size="13" font-weight="bold" fill="#6d28d9">1</text>
<line x1="20" y1="536" x2="1122" y2="536" stroke="#eeeeee" stroke-width="1"/>
<text x="20" y="558" font-size="9.5" fill="#888"><tspan font-size="10.0" dy="-1.0" fill="#666">†</tspan><tspan dy="1.0" xml:space="preserve">  These are lines of credit, not a ranking. A pioneer is the earliest Indian constitutional document that either stated the rule an article states or documented, in its own text, a clear intent to secure it —</tspan></text>
<text x="33" y="571" font-size="9.5" fill="#888">a claim of priority on paper, established by comparing the dated texts, not a claim that the 1947 framers consulted the document; the mark ° denotes document-level credit — the body or author is known, the</text>
<text x="33" y="584" font-size="9.5" fill="#888">drafter of the clause is not. A solid chip marks an article whose pioneer this document is alone; an outlined chip, an article whose limbs trace to different documents, which therefore appears in more than</text>
<text x="33" y="597" font-size="9.5" fill="#888">one row.</text>
<text x="20" y="614" font-size="9.5" fill="#888"><tspan font-size="6.6" dy="-4" fill="#666">1</tspan><tspan dy="4" xml:space="preserve">  Articles 17 and 27 (Nehru Report) and 15(1) (Karachi) qualify by documented intent; every other credit is a stated rule. The Minorities Pact first states Article 17’s rule — the Nehru Report holds the cell</tspan></text>
<text x="33" y="627" font-size="9.5" fill="#888">as earlier documented intent — and is held in this study as quoted and endorsed by the Sapru Report 1945.</text>
<text x="20" y="644" font-size="9.5" fill="#888"><tspan font-size="6.6" dy="-4" fill="#666">2</tspan><tspan dy="4" xml:space="preserve">  The Congress–League Scheme of 1916 pioneers nothing: it has no bill of rights. The Government of India Act 1935 is outside the Indian-authored scope. Article 22 is the one right with no constitutional</tspan></text>
<text x="33" y="657" font-size="9.5" fill="#888">pioneer of any kind. Full article-by-article evidence is on the companion chart, Pioneers and Framers of the Fundamental Rights.</text>
