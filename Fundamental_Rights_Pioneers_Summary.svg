<text x="20" y="444.0" font-size="8.6" fill="#777">Second Round Table Conference, Nov 1931 — the first statement</text>
<text x="20" y="455.0" font-size="8.6" fill="#777">of Article 17’s rule; Ambedkar sat for the Depressed Classes</text>
