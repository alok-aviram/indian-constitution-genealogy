<text x="20" y="830" font-size="9.5" fill="#888"><tspan font-size="10.0" dy="-1.0" fill="#666">†</tspan><tspan dy="1.0" xml:space="preserve">  These are lines of credit, not a ranking. A framer is whoever proposed the words that survive in the article as adopted, joined — where the record documents it — by the driving force behind a collective</tspan></text>
<text x="33" y="843" font-size="9.5" fill="#888">body’s wording and the author of the base draft. A solid chip marks an article where the person is the sole named framer; an outlined chip, one shared with others. Shared articles appear under each of their</text>
<text x="33" y="856" font-size="9.5" fill="#888">framers, so the counts sum past nineteen.</text>
<text x="20" y="873" font-size="9.5" fill="#888"><tspan font-size="6.6" dy="-4" fill="#666">1</tspan><tspan dy="4" xml:space="preserve">  Collective bodies hold the remaining credit and are shown on the companion chart, Pioneers and Framers of the Fundamental Rights: the Drafting Committee (Article 14’s enacted syntax, Article 17’s enacted</tspan></text>
<text x="33" y="886" font-size="9.5" fill="#888">sentence, Article 21’s ‘procedure established by law’), the Minorities Sub-Committee (Article 25’s three verbs, carried 10–5 with the mover unminuted) and the ad hoc Committee on clause 11 (Article 23’s</text>
<text x="33" y="899" font-size="9.5" fill="#888">redraft).</text>
<text x="20" y="916" font-size="9.5" fill="#888"><tspan font-size="6.6" dy="-4" fill="#666">2</tspan><tspan dy="4" xml:space="preserve">  Articles 12–35 are Part III; this chart, like its companion, covers the nineteen rights, Articles 14–32. Of the frame provisions analysed in the report, Rau also holds 12 and 13, Munshi 33, Ambedkar 35.</tspan></text>
<line x1="20" y1="932" x2="1122" y2="932" stroke="#e2e2e2" stroke-width="1"/>
<text x="20" y="941" font-size="9.0" fill="#9a9a9a">Compiled from the primary texts (Constituent Assembly Debates; digitised documents, constitutionofindia.net).</text>
